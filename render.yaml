services:
  - type: web
    name: auditor-backend-iqt1
    runtime: docker
    repo: https://github.com/abdertalibi-gif/Agent_readiness_auditor.git
    branch: main
    dockerfilePath: docker/Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: APP_ENV
        value: production

      - key: DEBUG
        value: "false"

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        sync: false

      - key: JOB_MODE
        value: inline

      - key: FRONTEND_URL
        value: https://agent-readiness-auditor.onrender.com

      - key: CORS_ORIGINS
        value: https://agent-readiness-auditor.onrender.com

      - key: ALLOW_PRIVATE_IP_RANGES
        value: "false"

      - key: AI_PROVIDER
        value: none

  - type: web
    name: agent-readiness-auditor
    runtime: docker
    repo: https://github.com/abdertalibi-gif/Agent_readiness_auditor.git
    branch: main
    dockerfilePath: docker/Dockerfile.frontend
    dockerContext: .
    plan: free
    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: BACKEND_INTERNAL_URL
        value: https://auditor-backend-iqt1.onrender.com

      - key: NEXT_PUBLIC_MONETIZATION_ENABLED
        value: "false"
