# Render Blueprint - Agent-Readiness Auditor
# Deploy with: Render Dashboard > New > Blueprint > Connect this repo
# Prerequisites:
#   1. Create a free PostgreSQL on Neon (https://neon.tech) or Supabase.
#      Neon free tier = 0.5 GB, no credit card. Copy the connection string.
#      Example: postgresql://user:password@ep-xxx.neon.tech/neondb?sslmode=require
#      Render will normalize it to postgresql+psycopg:// automatically.
#   2. Push this file to branch `main` on GitHub.
#   3. In Render, set DATABASE_URL and SECRET_KEY when prompted (see envVars below).
#
# Architecture (free tier, no Redis/Celery):
#   auditor-backend  -> FastAPI (docker/Dockerfile.backend)  JOB_MODE=inline (background tasks in-process)
#   auditor-frontend -> Next.js standalone (docker/Dockerfile.frontend) proxies /api/* -> backend
#   Database         -> external Neon/Supabase (DATABASE_URL secret)
#
# URLs after deploy:
#   https://auditor-frontend-iqt1.onrender.com  (public entry point - users use this)
#   https://auditor-backend-iqt1.onrender.com   (API + /docs)
#
services:
  - type: web
    name: auditor-backend-iqt1
    runtime: docker
    repo: https://github.com/abdertalibi-gif/Agent_readiness_auditor.git
    branch: main
    dockerfilePath: docker/Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set in Render dashboard: postgresql://... from Neon (will be auto-normalized)
      - key: JOB_MODE
        value: inline
       - key: FRONTEND_URL
        value: https://agent-readiness-auditor.onrender.com

      - key: CORS_ORIGINS
        value: https://agent-readiness-auditor.onrender.com
      - key: ALLOW_PRIVATE_IP_RANGES
        value: "false"
      - key: AI_PROVIDER
        value: none
      # Optional: uncomment and set as sync:false if you use OpenAI
      # - key: AI_API_KEY
      #   sync: false
      # - key: AI_MODEL
      #   value: gpt-4o-mini

  - type: web
    name: auditor-frontend-iqt1
    runtime: docker
    repo: https://github.com/abdertalibi-gif/Agent_readiness_auditor.git
    branch: main
    dockerfilePath: docker/Dockerfile.frontend
    dockerContext: .
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: BACKEND_INTERNAL_URL
        value: https://auditor-backend-iqt1.onrender.com
      - key: NEXT_PUBLIC_MONETIZATION_ENABLED
        value: "false"
