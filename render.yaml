# Render Blueprint - Agent Readiness Auditor
# Architecture:
#   Backend  -> FastAPI
#   Frontend -> Next.js
#   Database -> External Neon/Supabase PostgreSQL

services:

  # =========================
  # BACKEND
  # =========================
  - type: web
    name: auditor-backend-iqt1
    runtime: docker

    repo: https://github.com/abdertalibi-gif/Agent_readiness_auditor.git
    branch: main

    dockerfilePath: docker/Dockerfile.backend
    dockerContext: .

    plan: free

    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: APP_ENV
        value: production

      - key: DEBUG
        value: "false"

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        sync: false

      - key: JOB_MODE
        value: inline

      - key: FRONTEND_URL
        value: https://agentreadinessauditor.com

      - key: CORS_ORIGINS
        value: https://auditor-frontend-iqt1.onrender.com,https://agentreadinessauditor.com,https://www.agentreadinessauditor.com

      - key: ALLOW_PRIVATE_IP_RANGES
        value: "false"

      - key: RATE_LIMIT_REQUESTS
        value: "5"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "900"

      - key: AI_PROVIDER
        value: none

      # Optional OpenAI configuration
      # Uncomment only if you use OpenAI
      #
      # - key: AI_API_KEY
      #   sync: false
      #
      # - key: AI_MODEL
      #   value: gpt-4o-mini


  # =========================
  # FRONTEND
  # =========================
  - type: web
    name: agent-readiness-auditor
    runtime: docker

    repo: https://github.com/abdertalibi-gif/Agent_readiness_auditor.git
    branch: main

    dockerfilePath: docker/Dockerfile.frontend
    dockerContext: .

    plan: free

    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: BACKEND_INTERNAL_URL
        value: https://auditor-backend-iqt1.onrender.com

      - key: NEXT_PUBLIC_MONETIZATION_ENABLED
        value: "false"
